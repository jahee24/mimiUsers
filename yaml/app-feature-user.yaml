apiVersion: apps/v1
kind: Deployment
metadata:
  name: mimiusertestpod
  labels:
    project: mimitest
  namespace: mimi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mimiuser
  template:
    metadata:
      labels:
        app: mimiuser
    spec:
      containers:
        - name: mimiusertest
          image: daul0519/mimiusers:v.1
          ports:
            - containerPort: 5679
          env:
            - name: DB_HOST
              value: "mimimysql"
            - name: DB_NAME
              value: "mimi"
            - name: DB_USER
              value: "mytest"
            - name: DB_PASSWORD
              value: "1234"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://10.105.167.121:3306/mimi"
            - name: SPRING_DATASOURCE_USERNAME
              value: "mytest"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "1234"
---

apiVersion: v1
kind: Service
metadata:
  name: mimi-user-service
  labels:
    project: mimitest
  namespace: mimi
spec:
  selector:
    app: mimiuser
  type: ClusterIP
  ports:
    - port: 5679 # 노출할 서비스의 포트
      targetPort: 5679 #서비스포트와 연결할 컨테이너 포트, containerPort와 일치


